<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08060d">
<title>حساب کاربری | گلدن ماگ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Tahoma,Arial;background:radial-gradient(circle at 15% 10%,#482078 0,transparent 35%),radial-gradient(circle at 90% 90%,#493800 0,transparent 28%),#08060d;color:#fff;display:grid;place-items:center}
.wrap{width:min(470px,100%)}.brand{text-align:center;color:#ffd21a;font-size:29px;font-weight:bold;margin-bottom:18px}.brand span{color:#b78aff}
.card{background:rgba(18,13,28,.96);border:1px solid #7040a6;border-radius:24px;padding:27px;box-shadow:0 20px 70px #0009}
h1{font-size:25px;margin:0 0 9px;color:#ffd21a}.sub{color:#bdb3cb;line-height:1.9;font-size:13px;margin:0 0 20px}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button,.mainbtn,.logout{border:0;border-radius:12px;padding:13px;font:bold 14px Tahoma;cursor:pointer}.tabs button{flex:1;background:#21172e;color:#ddd}.tabs button.active{background:#6d28d9;color:#fff}
input{width:100%;padding:14px;margin:7px 0;background:#0c0912;color:#fff;border:1px solid #49365e;border-radius:12px;font:14px Tahoma;outline:none}input:focus{border-color:#ffd21a}
.mainbtn{width:100%;margin-top:12px;background:#ffd21a;color:#130d00}.mainbtn:hover{background:#ffe36a}.msg{min-height:24px;margin-top:14px;color:#ffd21a;font-size:13px;line-height:1.8}.back{display:block;text-align:center;color:#c8b0ec;margin-top:19px;text-decoration:none;font-size:13px}
.hidden{display:none!important}.profile-info{background:#100b19;border:1px solid #3e2a55;border-radius:15px;padding:15px;line-height:2.1;color:#ddd;font-size:14px}.logout{width:100%;margin-top:14px;background:#42245d;color:#fff}.small{font-size:11px;color:#968aa5;line-height:1.8;margin-top:14px}
</style>
</head>
<body><main class="wrap">
<div class="brand">گلدن <span>ماگ</span></div>
<section class="card" id="authCard">
<h1>حساب کاربری</h1><p class="sub">برای نگهداری سبد خرید و اطلاعات حساب، وارد شو یا یک حساب جدید بساز.</p>
<div class="tabs"><button id="loginTab" class="active" type="button">ورود</button><button id="registerTab" type="button">ثبت‌نام</button></div>
<form id="loginForm">
<input id="loginEmail" type="email" maxlength="254" placeholder="ایمیل" autocomplete="email" required>
<input id="loginPassword" type="password" maxlength="72" placeholder="رمز عبور" autocomplete="current-password" required>
<button class="mainbtn" type="submit">ورود به حساب</button>
</form>
<form id="registerForm" class="hidden">
<input id="fullName" type="text" maxlength="80" placeholder="نام و نام خانوادگی" autocomplete="name" required>
<input id="registerEmail" type="email" maxlength="254" placeholder="ایمیل" autocomplete="email" required>
<input id="registerPassword" type="password" minlength="8" maxlength="72" placeholder="رمز عبور (حداقل ۸ کاراکتر)" autocomplete="new-password" required>
<button class="mainbtn" type="submit">ساخت حساب کاربری</button>
</form>
<div class="msg" id="message" role="status"></div>
<p class="small">رمز عبور به‌صورت متن ساده ذخیره نمی‌شود؛ سرور آن را به‌شکل هش‌شده نگهداری می‌کند.</p>
</section>
<section class="card hidden" id="profileCard">
<h1>خوش اومدی!</h1><p class="sub">حساب کاربری گلدن ماگ</p>
<div class="profile-info" id="profileInfo"></div>
<button class="mainbtn" type="button" onclick="location.href='index.html'">رفتن به فروشگاه</button>
<button class="logout" id="logoutBtn" type="button">خروج از حساب</button>
<div class="msg" id="profileMessage"></div>
</section>
<a class="back" href="index.html">بازگشت به فروشگاه</a>
</main>
<script src="api-config.js"></script>
<script>
const API_BASE=window.GOLDEN_MUG_API||"";
const $=id=>document.getElementById(id);
async function api(path,options={}){
 if(!API_BASE)throw new Error("آدرس سرور هنوز تنظیم نشده است.");
 const response=await fetch(API_BASE+path,{credentials:"include",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||"ارتباط با سرور برقرار نشد.");
 return data;
}
function showMessage(text){$("message").textContent=text}
function switchMode(mode){
 const login=mode==="login";
 $("loginForm").classList.toggle("hidden",!login);
 $("registerForm").classList.toggle("hidden",login);
 $("loginTab").classList.toggle("active",login);
 $("registerTab").classList.toggle("active",!login);
 showMessage("");
}
$("loginTab").onclick=()=>switchMode("login");
$("registerTab").onclick=()=>switchMode("register");
$("loginForm").onsubmit=async e=>{
 e.preventDefault();showMessage("در حال ورود...");
 try{await api("/api/login",{method:"POST",body:JSON.stringify({email:$("loginEmail").value,password:$("loginPassword").value})});await loadProfile();}
 catch(err){showMessage(err.message);}
};
$("registerForm").onsubmit=async e=>{
 e.preventDefault();showMessage("در حال ساخت حساب...");
 try{await api("/api/register",{method:"POST",body:JSON.stringify({fullName:$("fullName").value,email:$("registerEmail").value,password:$("registerPassword").value})});await loadProfile();}
 catch(err){showMessage(err.message);}
};
async function loadProfile(){
 try{const data=await api("/api/me");$("authCard").classList.add("hidden");$("profileCard").classList.remove("hidden");$("profileInfo").textContent="نام: "+data.user.fullName+"\nایمیل: "+data.user.email;}
 catch(e){if(e.message.includes("سرور"))showMessage(e.message);}
}
$("logoutBtn").onclick=async()=>{try{await api("/api/logout",{method:"POST"});$("profileCard").classList.add("hidden");$("authCard").classList.remove("hidden");switchMode("login");}catch(e){$("profileMessage").textContent=e.message;}};
loadProfile();
</script>
</body></html>
