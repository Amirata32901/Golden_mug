services:
  - type: web
    name: golden-mug-account-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: golden-mug-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://amirata32901.github.io
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: golden-mug-db
    plan: free
    region: frankfurt
    databaseName: golden_mug
    user: golden_mug_user
